name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            # entrambe le architetture: un dmg arm64-only non parte sui Mac Intel
            args: --mac --x64 --arm64
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned builds (no certificates in CI)
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: app
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Check that the tag matches the app version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./app/package.json').version")
          echo "tag: $GITHUB_REF_NAME -> $TAG | app/package.json: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Il tag $GITHUB_REF_NAME non corrisponde alla versione $PKG in app/package.json"
            exit 1
          fi
      - name: Run tests
        run: npm test
        working-directory: app
      - name: Check native MIDI module loads
        # Verifica che il binario precompilato per QUESTA piattaforma sia presente e
        # caricabile (è l'obiettivo del controllo). Non si costruiscono porte MIDI:
        # su un runner CI non esiste il sequencer ALSA (/dev/snd/seq), quindi
        # new Input() fallirebbe pur essendo tutto a posto.
        run: node -e "require('@julusian/midi'); console.log('native MIDI module loaded OK on', process.platform, process.arch);"
        working-directory: app
      - name: Build installers
        # --publish never: gli artefatti (compreso latest.yml) li pubblica il job "release",
        # così la release non viene creata due volte
        run: npx electron-builder ${{ matrix.args }} --publish never
        working-directory: app
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ManageFreak-${{ matrix.os }}
          path: |
            app/dist/*.exe
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/latest*.yml
            app/dist/*.blockmap
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # serve per leggere le note di release versionate in .github/release-notes/
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Check that the artifacts were downloaded
        # senza questo controllo una release "vuota" (come è successo) risulta
        # riuscita pur non allegando nulla: meglio fallire in modo esplicito
        run: |
          echo "Contenuto scaricato:"
          find artifacts -type f -printf '%p\n' | head -40
          count=$(find artifacts -type f | wc -l)
          echo "file totali: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::Nessun artefatto scaricato: la release non va pubblicata a vuoto"
            exit 1
          fi
      - name: Look for curated release notes
        id: notes
        # controllo esplicito con test -f: hashFiles() in una condizione if non
        # ha trovato il file (verificato su questa release) e il ramo curato
        # veniva saltato in silenzio
        run: |
          f=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then
            echo "path=$f" >> "$GITHUB_OUTPUT"
            echo "note curate trovate: $f"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "nessuna nota curata per ${GITHUB_REF_NAME}: si usano le note automatiche"
          fi
      - name: Publish GitHub Release (curated notes)
        # se esiste .github/release-notes/<tag>.md si usa quello come corpo della
        # release (contiene anche la guida "quale file scaricare")
        if: steps.notes.outputs.path != ''
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.yml
            artifacts/*.blockmap
          fail_on_unmatched_files: true
          body_path: ${{ steps.notes.outputs.path }}
      - name: Publish GitHub Release (generated notes)
        if: steps.notes.outputs.path == ''
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.yml
            artifacts/*.blockmap
          fail_on_unmatched_files: true
          generate_release_notes: true
